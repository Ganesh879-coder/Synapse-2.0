services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    environment:
      - KAVACH_ENV=production
      - DATA_DIR=/data
      - DB_URL=sqlite:////data/kavach.db
      - KAVACH_API_KEYS=${KAVACH_API_KEYS:-change-me-in-env}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
    volumes:
      - kavach_data:/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  kavach_data:
